# Builds the Windows exe on every push, so nobody has to build locally.
#   - Each branch gets a pre-release named "build-<branch>" with GermBall-win-x64.zip
#     (one self-contained GermBall.exe, no .NET install needed).
#   - Germ Ball 1.0 (deprecated, in legacy/) is published once as the "v1.0" release and never rebuilt.
name: Windows exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
  # the last commit of 1.0, before the 2.0 rewrite
  V1_COMMIT: bbbe20846c3e0a8e7054bfa9b884ad88a2b7538b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet run --project tests/GermBall.Tests -c Release

      - name: Publish GermBall.exe
        run: |
          dotnet publish src/GermBall/GermBall.csproj $PUBLISH -o out
          (cd out && zip -q -9 ../GermBall-win-x64.zip GermBall.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: GermBall-win-x64
          path: GermBall-win-x64.zip

      - name: Update the branch's download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" GermBall-win-x64.zip \
            --prerelease --target "$GITHUB_SHA" --title "Germ Ball 2.0-dev: ${GITHUB_REF_NAME}" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Unzip and double-click GermBall.exe; no .NET install needed."

      - name: Publish Germ Ball 1.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then echo "v1.0 already published"; exit 0; fi
          dotnet publish legacy/src/GermBall/GermBall.csproj $PUBLISH -o out-v1
          (cd out-v1 && zip -q -9 -r ../GermBall-1.0-win-x64.zip GermBall.exe data)
          gh release create v1.0 GermBall-1.0-win-x64.zip --target "$V1_COMMIT" --latest=false \
            --title "Germ Ball 1.0 (deprecated)" \
            --notes "The original full game, frozen. Development continues on 2.0. Unzip and run GermBall.exe with its data folder next to it."
